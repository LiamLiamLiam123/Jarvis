<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<meta name="theme-color" content="#0a0a0a">
<style>
:root{--bg:#0a0a0a;--ink:#d6e4ee;--dim:#7d8a94;--cyan:#38b6f5;--line:rgba(56,182,245,.07)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
h1{font:700 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--cyan)}
.status{display:flex;align-items:center;gap:8px;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#4caf50}
.status.err .dot{background:#e5534b}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 24px}
.orb{position:relative;width:152px;height:152px;border-radius:50%;background:#0b0b0b;border:0;cursor:pointer;
box-shadow:0 0 0 1px rgba(56,182,245,.25),0 0 38px rgba(56,182,245,.45);display:grid;place-items:center;transition:box-shadow .3s}
.orb:focus-visible{outline:2px solid var(--cyan);outline-offset:6px}
.ring{position:absolute;inset:24px;border-radius:50%;border:1px solid rgba(56,182,245,.55);animation:spin 9s linear infinite}
.ring::before,.ring::after{content:"";position:absolute;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--cyan)}
.ring::before{top:-4px}.ring::after{bottom:-4px}
.core{width:64px;height:64px;border-radius:50%;background:#16232b;display:grid;place-items:center}
.core svg{width:30px;height:30px;stroke:var(--cyan);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:12px;color:var(--dim)}
.caption{max-width:520px;text-align:center;color:#5d6a73;font-size:13px;min-height:40px}
.listening .orb{animation:breathe 3.2s ease-in-out infinite}
.hearing .orb{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 1px #6fd3ff,0 0 60px rgba(111,211,255,.7)}
.thinking .ring{animation-duration:1.6s}
.speaking .orb{animation:pulse .6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(56,182,245,.4),0 0 54px rgba(56,182,245,.6)}}
@media (prefers-reduced-motion:reduce){.ring,.orb{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S</h1>
  <div class="status" id="status"><span class="dot"></span><span id="online">Online</span></div>
</header>

<main id="stage" class="idle">
  <button class="orb" id="orb" aria-label="Activate Jarvis, or interrupt while he is speaking">
    <span class="ring"></span>
    <span class="core"><svg viewBox="0 0 24 24"><path d="M12 5v14M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 4 3 3 0 0 0 1 4 3 3 0 0 0 4 3 2 2 0 0 0 3-1M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 4 3 3 0 0 1-1 4 3 3 0 0 1-4 3 2 2 0 0 1-3-1"/></svg></span>
  </button>
  <div class="label" id="label" aria-live="polite">Starting microphone</div>
  <div class="caption" id="caption"></div>
</main>

<script>
/* Anyone who can open this file can read these keys. */
/* Your API keys. Anyone who can open this page can read them. */
const KEYS = { groq: "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", fish: "sk-fish-VsntcLIei8ExHKW0qpvqsu_LgnZSqmBmUL1gVq79mt4" };
const CORS_PROXY = "https://corsproxy.io/?url="; // Fish Audio blocks direct browser calls, so TTS goes through this
function key(name){
  let k = KEYS[name] || localStorage.getItem("jarvis-" + name);
  if (!k){
    k = (prompt(name === "groq" ? "Paste your Groq API key (kept only in this browser):" : "Paste your Fish Audio API key (kept only in this browser):") || "").trim();
    if (k) localStorage.setItem("jarvis-" + name, k);
  }
  return k;
}
const badKey = name => localStorage.removeItem("jarvis-" + name); // so a wrong key is asked for again
// Fish Audio voice (the ID at the end of a fish.audio/m/<id> link).
// Other Jarvis voices to try: 612b878b113047d9a770c069c8b4fdfe (Jarvis MCU J.A.R.V.I.S), 3182cd218d4b4a58b8a2b383d553a2b1
const FISH_VOICE = "2e0938cc92184871b2728776c48c6ae7"; // Jarvis M.C.U (English Voice - Remake)
// Free Groq chat models, tried in order (Groq retired the Llama 3.x models on free tier in Aug 2026)
const MODELS = ["openai/gpt-oss-20b", "openai/gpt-oss-120b"];
const FISH_MODEL = "s2.1-pro-free"; // Fish's free developer-tier model
const STT_MODEL = "whisper-large-v3-turbo"; // free Groq speech-to-text

const SYSTEM = "You are J.A.R.V.I.S., a calm, witty, highly capable AI butler. Address the user as 'sir' occasionally. You are speaking aloud, so answer in 1-3 short sentences unless asked for detail. Plain spoken text only: no markdown, lists, symbols or emoji.";
const $ = id => document.getElementById(id);
const stage = $("stage"), label = $("label"), caption = $("caption");
const history = [];
let stream = null, ctx = null, analyser = null, buf = null, micLive = false;
let mr = null, chunks = [], recording = false, voicedMs = 0, lastVoice = 0, recStart = 0, loud = 0, floor = 0.01;
let busy = false, speaking = false, audio = null, pending = null;

function setState(s, t){ stage.className = s; label.textContent = t; }
function idleState(){ setState("listening", "Listening"); }
function fail(msg){
  busy = false; speaking = false;
  $("status").classList.add("err"); $("online").textContent = "Error";
  setState("idle", msg);
  if (micLive) setTimeout(() => { $("status").classList.remove("err"); $("online").textContent = "Online"; if (!busy && !speaking) idleState(); }, 3500);
}

/* ---- Microphone: opened once and kept open, so the browser asks only once ---- */
async function startMic(){
  if (micLive) { if (ctx && ctx.state === "suspended") ctx.resume(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
  } catch(e){
    return setState("idle", e.name === "NotAllowedError" ? "Microphone blocked. Allow it in the address bar, then tap the orb" : "No microphone found");
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  ctx.resume().catch(() => {});
  micLive = true; idleState();
  setInterval(tick, 50);
}

/* Simple voice-activity detection: record when you start talking, send when you pause. */
function tick(){
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  if (busy || speaking) return;
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (const v of buf) sum += v * v;
  const rms = Math.sqrt(sum / buf.length), now = performance.now();
  const threshold = Math.max(0.02, floor * 3.5);
  if (rms > threshold){
    lastVoice = now; voicedMs += 50; loud++;
    if (!recording && loud >= 2) startRec();
  } else {
    loud = 0;
    if (!recording) floor = floor * 0.97 + rms * 0.03;
  }
  if (recording && (now - lastVoice > 900 || now - recStart > 25000)) stopRec();
}
function startRec(){
  chunks = []; voicedMs = 100; recording = true; recStart = performance.now();
  mr = new MediaRecorder(stream);
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = () => {
    const blob = new Blob(chunks, { type: mr.mimeType });
    if (voicedMs >= 350) transcribe(blob); else if (!busy && !speaking) idleState();
  };
  mr.start(); setState("hearing", "Hearing you");
}
function stopRec(){ recording = false; if (mr && mr.state === "recording") mr.stop(); }

async function transcribe(blob){
  busy = true; setState("thinking", "Thinking");
  try {
    const fd = new FormData();
    fd.append("file", blob, "speech." + (blob.type.includes("mp4") ? "mp4" : "webm"));
    fd.append("model", STT_MODEL); fd.append("language", "en"); fd.append("temperature", "0");
    const r = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
      method:"POST", headers:{ "Authorization":"Bearer " + key("groq") }, body: fd });
    if (r.status === 401) badKey("groq");
    if (!r.ok) throw new Error("Speech recognition error " + r.status);
    const text = ((await r.json()).text || "").trim();
    // Ignore noise and Whisper's habitual phantom phrases on near-silence
    if (text.replace(/[^a-z]/gi, "").length < 2 || /^(thank you|thanks for watching|you)\W*$/i.test(text)){
      busy = false; return idleState();
    }
    await ask(text);
  } catch(e){ fail(e.message); }
}

async function ask(q){
  caption.textContent = q;
  history.push({ role:"user", content:q });
  let reply = "", lastErr = "";
  for (const model of MODELS){
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{ "Authorization":"Bearer " + key("groq"), "Content-Type":"application/json" },
      body: JSON.stringify({ model, temperature: .7, max_completion_tokens: 1000, reasoning_effort: "low",
        messages: [{ role:"system", content:SYSTEM }, ...history.slice(-12)] })
    });
    if (r.ok){ reply = ((await r.json()).choices[0].message.content || "").trim(); if (reply) break; lastErr = "empty reply"; continue; }
    if (r.status === 401) badKey("groq");
    lastErr = "Groq " + r.status + " " + (await r.text()).slice(0, 120);
    if (r.status !== 404 && r.status !== 400) break;   // only try the next model if this one is unavailable
  }
  if (!reply){ history.pop(); throw new Error(lastErr); }
  history.push({ role:"assistant", content:reply });
  caption.textContent = reply;
  await speak(reply);
}

/* ---- Fish Audio voice ----
   Fish's API refuses calls from web pages (no CORS), so it needs a tiny relay. Use your own free Cloudflare Worker:
   dash.cloudflare.com > Workers & Pages > Create > Worker > Deploy > Edit code > paste the code below > Deploy,
   then paste the *.workers.dev address into FISH_PROXY.

   export default { async fetch(req) {
     const cors = { "Access-Control-Allow-Origin":"*", "Access-Control-Allow-Headers":"*", "Access-Control-Allow-Methods":"POST, OPTIONS" };
     if (req.method === "OPTIONS") return new Response(null, { status:204, headers:cors });
     const r = await fetch("https://api.fish.audio/v1/tts", { method:"POST", body:req.body, headers:{
       "Authorization":req.headers.get("Authorization"), "Content-Type":"application/json", "model":req.headers.get("model") || "s2.1-pro-free" } });
     return new Response(r.body, { status:r.status, headers:{ ...cors, "Content-Type":r.headers.get("Content-Type") || "audio/mpeg" } });
   } }
*/
const FISH_PROXY = "https://jarvis.daddystephenson34.workers.dev/"; // <- your Cloudflare Worker address, e.g. "https://jarvis-fish.yourname.workers.dev"
let speakId = 0;

async function voiceBlob(text){
  const url = FISH_PROXY || (CORS_PROXY + encodeURIComponent("https://api.fish.audio/v1/tts")); // corsproxy.io only works for development
  const body = { text, format:"mp3", latency:"balanced" };
  if (FISH_VOICE) body.reference_id = FISH_VOICE;
  const r = await fetch(url, { method:"POST",
    headers:{ "Authorization":"Bearer " + key("fish"), "Content-Type":"application/json", "model": FISH_MODEL }, body: JSON.stringify(body) });
  if (r.status === 401) badKey("fish");
  if (!r.ok) throw new Error("Fish Audio " + r.status + " " + (await r.text()).slice(0, 140));
  return r.blob();
}
function playBlob(blob){
  return new Promise((res, rej) => {
    const a = new Audio(URL.createObjectURL(blob)); audio = a;
    a.onended = res; a.onerror = () => rej(new Error("Audio playback failed"));
    a.play().catch(err => {
      if (err.name === "NotAllowedError"){ pending = a; setState("speaking", "Press any key to hear Jarvis"); }
      else rej(err);
    });
  });
}
async function speak(text){
  const my = ++speakId;
  speaking = true; busy = false; setState("speaking", "Speaking");
  const done = () => { if (my !== speakId) return; speaking = false; voicedMs = 0; loud = 0; idleState(); };
  try {
    const blob = await voiceBlob(text);
    if (my !== speakId) return;                    // interrupted
    await playBlob(blob);
    done();
  } catch(e){
    if (my !== speakId) return;
    const why = e instanceof TypeError
      ? (FISH_PROXY ? "Could not reach your Fish proxy" : "No Fish proxy set. Add your Cloudflare Worker address to FISH_PROXY")
      : e.message;
    caption.textContent = text + "\n[" + why + ". Using the browser voice.]";
    if ("speechSynthesis" in window){
      const u = new SpeechSynthesisUtterance(text);
      u.onend = u.onerror = done; speechSynthesis.speak(u);
    } else done();
  }
}

/* Orb: starts the mic if it isn't running yet; interrupts Jarvis while he is speaking. */
$("orb").onclick = async () => {
  if (!micLive) return startMic();
  if (speaking){
    speakId++;
    if (audio){ audio.onended = null; audio.pause(); audio = null; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false; voicedMs = 0; loud = 0; idleState();
  }
};
// Browsers only allow sound after a click or key press, so the first one also wakes the audio engine
function unlock(){
  if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
  if (pending){ const a = pending; pending = null; setState("speaking", "Speaking"); a.play().catch(() => { speaking = false; idleState(); }); }
}
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, unlock));

// Open the microphone as soon as the page loads (no tap needed). If the browser holds it back, the first tap or key press starts it.
startMic();
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { if (!micLive) startMic(); }, { once:true }));

/* Makes the page installable as an app, all from this one file. An installed app may play sound without a tap. */
(function(){
  const icon = n => {
    const c = document.createElement("canvas"); c.width = c.height = n; const g = c.getContext("2d"), m = n / 2;
    g.fillStyle = "#0a0a0a"; g.fillRect(0, 0, n, n);
    g.shadowColor = "rgba(56,182,245,.8)"; g.shadowBlur = n * .08;
    g.fillStyle = "#0b0b0b"; g.strokeStyle = "#38b6f5"; g.lineWidth = n * .012;
    g.beginPath(); g.arc(m, m, n * .28, 0, 7); g.fill(); g.stroke(); g.shadowBlur = 0;
    g.lineWidth = n * .01; g.beginPath(); g.arc(m, m, n * .19, 0, 7); g.stroke();
    g.fillStyle = "#38b6f5";
    for (const y of [m - n * .19, m + n * .19]){ g.beginPath(); g.arc(m, y, n * .025, 0, 7); g.fill(); }
    g.fillStyle = "#16232b"; g.beginPath(); g.arc(m, m, n * .11, 0, 7); g.fill();
    g.fillStyle = "#38b6f5"; g.beginPath(); g.arc(m, m, n * .035, 0, 7); g.fill();
    return c.toDataURL("image/png");
  };
  const base = location.href.split("#")[0].split("?")[0];
  const manifest = { name:"J.A.R.V.I.S", short_name:"Jarvis", start_url: base, scope: base.replace(/[^/]*$/, ""),
    display:"standalone", background_color:"#0a0a0a", theme_color:"#0a0a0a",
    icons:[{ src: icon(192), sizes:"192x192", type:"image/png" }, { src: icon(512), sizes:"512x512", type:"image/png" }] };
  const link = document.createElement("link"); link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" }));
  document.head.appendChild(link);
  const fav = document.createElement("link"); fav.rel = "icon"; fav.href = icon(64); document.head.appendChild(fav);
})();
</script>
</body>
</html>
